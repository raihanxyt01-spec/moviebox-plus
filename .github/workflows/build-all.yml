name: Build MovieBox+ Android APK and Windows Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: moviebox-gui/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        working-directory: moviebox-gui
        run: npm ci || npm install

      - name: Build Web Production Assets
        working-directory: moviebox-gui
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: moviebox-gui
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        working-directory: moviebox-gui/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: moviebox-gui/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Plus-Android-APK
          path: moviebox-gui/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: moviebox-gui/package-lock.json

      - name: Install Dependencies
        working-directory: moviebox-gui
        run: npm ci

      - name: Build Web & Package Windows EXE
        working-directory: moviebox-gui
        run: npm run electron:build

      - name: Upload Windows Setup & Portable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Plus-Windows-Release
          path: moviebox-gui/release/*.exe
          if-no-files-found: warn
