name: Build MovieBox+ Android APK and Windows Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Build Android APK (.apk)
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: moviebox-gui/package-lock.json

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Dependencies
        working-directory: moviebox-gui
        run: npm ci || npm install

      - name: Build Web Production Assets
        working-directory: moviebox-gui
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: moviebox-gui
        run: npx cap sync android || true

      - name: Grant Execute Permission for Gradlew
        working-directory: moviebox-gui/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: moviebox-gui/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Plus-Android-APK
          path: moviebox-gui/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 2. Build Windows Executables (.exe)
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: moviebox-gui/package-lock.json

      - name: Install Dependencies
        working-directory: moviebox-gui
        run: npm ci || npm install

      - name: Build Web & Package Windows EXE
        working-directory: moviebox-gui
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Plus-Windows-Release
          path: moviebox-gui/release/*.exe
          if-no-files-found: warn
