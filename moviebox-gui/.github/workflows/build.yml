name: Build and Release EXE and APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Build Windows Executables (.exe)
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build EXE
        shell: bash
        run: |
          if [ -d "moviebox-gui" ]; then cd moviebox-gui; fi
          npm ci
          npm run build
          npx electron-builder --win portable nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            **/release/*.exe

  # 2. Build Android Application (.apk)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Sync Capacitor
        run: |
          if [ -d "moviebox-gui" ]; then cd moviebox-gui; fi
          npm ci
          npm run build
          npx cap sync android || true

      - name: Build Android Debug APK
        run: |
          if [ -d "moviebox-gui/android" ]; then
            cd moviebox-gui/android
          elif [ -d "android" ]; then
            cd android
          fi
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            **/android/app/build/outputs/apk/**/*.apk

  # 3. Create GitHub Release when tagged
  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release-assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
